version: "3.9"

services:
  app:
    image: python:3.11-slim
    container_name: fastapi_app
    working_dir: /usr/src/app
    volumes:
      - ./app:/usr/src/app   # mount your FastAPI source code
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - neo4j

  neo4j:
    image: neo4j:5.20
    container_name: neo4j_db
    environment:
      - NEO4J_AUTH=neo4j/password   # change this password in production
      - NEO4J_PLUGINS=["apoc","graph-data-science"]
    volumes:
      - ./neo4j/data:/data         # database persistence
      - ./neo4j/logs:/logs
      - ./neo4j/import:/import     # local directory to import CSV/JSON files
      - ./neo4j/plugins:/plugins   # plugins storage
    ports:
      - "7474:7474"  # Neo4j Browser
      - "7687:7687"  # Bolt protocol

  postgres:
    image: postgres:16
    container_name: postgres_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=shop
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
